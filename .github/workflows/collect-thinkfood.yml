name: Collect - 식품음료신문 (test)

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/run_collectors.py

      - uses: actions/upload-artifact@v4
        with:
          name: raw-collect-output
          path: data/raw/
